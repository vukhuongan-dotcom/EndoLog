[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "endolog"
version = "0.3.2"
description = "Hệ thống sổ bộ lâm sàng & đánh giá chất lượng nội soi tiêu hoá — Khoa Nội soi Tiêu hóa, Bệnh viện Bình Dân"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "fasteners>=0.19",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"
